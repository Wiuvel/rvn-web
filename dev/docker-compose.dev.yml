# Local development stack for rvn-web.
# Brought up by `node dev/up.mjs`. rvn-web itself runs on the host (`pnpm dev`)
# for HMR and connects to these services on localhost.
name: rvn-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rvn
      POSTGRES_PASSWORD: rvn
      POSTGRES_DB: rvn
    ports:
      - '5432:5432'
    volumes:
      - ./.data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rvn -d rvn']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Local Redis is plaintext (redis://). No TLS, so rvn-web leaves
    # REDIS_CERT_PATH unset.
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: create the bucket and make avatar/banner prefixes publicly
  # readable (rvn-web uploads them with public-read ACL).
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/rvn &&
        mc anonymous set download local/rvn/avatars &&
        mc anonymous set download local/rvn/banners &&
        echo 'minio-setup: bucket rvn ready'
    restart: 'no'

  ws-server:
    build:
      context: ./.ws-server
    restart: unless-stopped
    ports:
      - '3002:3002'
    env_file:
      - ./.ws.env
    # rvn-web runs on the host; let the container reach it via the host gateway.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - postgres
      - redis
