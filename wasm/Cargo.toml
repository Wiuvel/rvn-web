# WASM модуль для обработки изображений (docs/IMAGE_CACHE_IMPLEMENTATION_PLAN.md, Фаза 2)
# Сборка: wasm-pack build --target nodejs --out-dir ../lib/wasm/pkg

[package]
name = "image-processor-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM image processor (resize) for Next.js media cache"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif"] }
