<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Авторизация | RVNPrivate</title>
  <link rel="icon" href="/static/favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
  <style>
    body {
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: white;
    }
    .animate-fadeIn { animation: fadeIn 1s ease-in-out; }
    @keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
    .animate-float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }
    .glass-btn {
      display: inline-block;
      min-width: 180px;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 500;
      text-align: center;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }
    .glass-btn:hover {
      background: rgba(22, 163, 255, 0.15);
      border-color: rgba(22,163,255,0.5);
      box-shadow: 0 0 16px rgba(22,163,255,0.35);
    }
    #particles-js {
      pointer-events: none; 
      z-index: 0;
    }
    #quote {
      text-shadow: 0 0 8px rgba(22,163,255,0.6), 0 0 16px rgba(22,163,255,0.4);
    }

    .fade-in-up {
      opacity: 1 !important;
      transform: translate(-50%, 0) !important;
    }
  </style>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-50 border-b border-neutral-800/70 bg-neutral-950/70 backdrop-blur-xl">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center">
        <a href="/" class="flex items-center gap-2">
          <img src="/static/logo.png" alt="RVNPrivate" class="h-8 w-8">
          <span class="font-semibold tracking-tight text-white">RVNPrivate</span>
        </a>
      </div>
    </div>
  </header>
  <section class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12">
    <div id="particles-js" class="absolute inset-0"></div>
    <div class="z-10 grid grid-cols-1 md:grid-cols-2 gap-12 items-center w-full max-w-5xl">
      <div x-data="authForms()" class="w-full max-w-md mx-auto">
        <div class="bg-neutral-900/80 backdrop-blur-xl p-8 rounded-2xl border border-neutral-800 shadow-lg animate-fadeIn">
          <h2 class="text-2xl font-semibold mb-6 text-center" x-text="tab==='register' ? 'Регистрация' : 'Вход'"></h2>
          <form x-show="tab==='register'" @submit.prevent="handleRegister" class="space-y-4">
            <input type="text" x-model="username" placeholder="Логин" required class="w-full px-4 py-3 rounded-xl bg-neutral-800 border border-neutral-700 text-white"/>
            <p class="text-red-500 text-sm mt-1" x-show="usernameError" x-text="usernameError"></p>
            <div class="relative">
              <input :type="showPassword ? 'text' : 'password'" x-model="password" placeholder="Пароль" required class="w-full px-4 py-3 rounded-xl bg-neutral-800 border border-neutral-700 text-white pr-10" @input="checkPassword(); checkConfirmPassword()"/>
              <button type="button" 
                      @click="showPassword = !showPassword"
                      class="absolute right-3 top-4 text-gray-500 hover:text-gray-700">
                <svg xmlns="http://www.w3.org/2000/svg" 
                    :class="{'hidden': showPassword}" 
                    class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M10 3C5 3 1.73 7.11 1 10c.73 2.89 4 7 9 7s8.27-4.11 9-7c-.73-2.89-4-7-9-7zm0 12c-2.76 0-5-2.24-5-5 s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
                  <path d="M10 8a2 2 0 100 4 2 2 0 000-4z"/>
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" 
                    :class="{'hidden': !showPassword}" 
                    class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M4.707 3.293a1 1 0 00-1.414 1.414l12.999 13a1 1 0 001.414-1.415l-2.32-2.319C16.924 12.15 18 10.172 18 10c-.73-2.89-4-7-9-7-1.276 0-2.464.3-3.536.835L4.707 3.293zM9.88 7.465A3 3 0 0113 10c0 .437-.095.852-.265 1.224l-2.856-2.856zM7.1 8.685l2.856 2.856A3 3 0 017 10c0-.437.095-.852.265-1.224L7.1 8.685z"/>
                </svg>
              </button>
            </div>
            <p class="text-red-400 text-xs mt-1" x-show="passwordError" x-text="passwordError"></p>
            <input type="password" x-model="confirmPassword" placeholder="Подтверждение пароля" required class="w-full px-4 py-3 rounded-xl bg-neutral-800 border border-neutral-700 text-white" :disabled="!passwordValid" :class="passwordValid ? 'border-neutral-700 opacity-100' : 'border-neutral-700 opacity-50'" @input="checkConfirmPassword()"/>
            <p class="text-red-400 text-xs mt-1" x-show="confirmPasswordError" x-text="confirmPasswordError"></p>
            <div class="flex items-start gap-2 text-xs text-neutral-400">
              <input type="checkbox" required class="mt-0.5 rounded border-neutral-700 bg-neutral-800"/>
              <span>Я согласен с <a href="/terms/" target="_blank" rel="noopener noreferrer" class="text-primary-400 hover:underline">Пользовательским соглашением</a> и <a href="/privacy/" target="_blank" rel="noopener noreferrer" class="text-primary-400 hover:underline">Политикой конфиденциальности</a>.</span>
            </div>
            <div class="flex justify-center mt-4">
              <div class="h-captcha" 
                  data-sitekey="11ec60ae-6f54-4fe0-9dda-707293c02de6" 
                  data-callback="onCaptchaVerify">
              </div>
            </div>
            <input type="hidden" name="h-captcha-response" x-model="captchaResponse">
            <p x-show="globalError" class="text-red-400 text-sm text-center mt-2" x-text="globalError"></p>
            <div class="flex justify-center">
              <button type="submit" class="glass-btn">Зарегистрироваться</button>
            </div>
            <p class="text-center text-sm text-neutral-400">Уже есть аккаунт? <a href="#" @click.prevent="tab='login'; resetForm()" class="text-primary-400 hover:underline">Войти</a></p>
          </form>
          <form x-show="tab==='login'" @submit.prevent="handleLogin" class="space-y-4">
            <input type="text" x-model="username" placeholder="Логин" required class="w-full px-4 py-3 rounded-xl bg-neutral-800 border border-neutral-700 text-white"/>
            <p class="text-red-500 text-sm mt-1" x-show="usernameError" x-text="usernameError"></p>

            <input type="password" x-model="password" placeholder="Пароль" required class="w-full px-4 py-3 rounded-xl bg-neutral-800 border border-neutral-700 text-white" @input="checkPassword()"/>
            <p class="text-red-500 text-xs mt-1" x-show="passwordError" x-text="passwordError"></p>

            <div class="flex justify-center">
              <button type="submit" class="glass-btn">Войти</button>
            </div>
            <p class="text-center text-sm text-neutral-400">Нет аккаунта? <a href="#" @click.prevent="tab='register'; resetForm()" class="text-primary-400 hover:underline">Зарегистрироваться</a></p>
          </form>
        </div>
      </div>
    </div>
    <div id="quote" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 text-neutral-400 text-sm opacity-0 transition duration-700 ease-out z-10">
      [ID: ––––––]
    </div>
    <script>
      async function setUserID() {
        try {
          const res = await fetch("https://api.ipify.org?format=json");
          const data = await res.json();
          const ip = data.ip;

          const hash = ip.split("")
            .map(c => c.charCodeAt(0))
            .reduce((a, b) => a + b, 0);

          const id = (hash % 1000000).toString().padStart(6, "0");

          const el = document.getElementById("quote");
          el.textContent = `[ID: ${id}]`;

          setTimeout(() => {
            el.classList.add("fade-in-up");
          }, 200);
        } catch (err) {
          const el = document.getElementById("quote");
          el.textContent = "[ID: offline]";
          setTimeout(() => {
            el.classList.add("fade-in-up");
          }, 200);
        }
      }
      setUserID();
    </script>
    <div class="hidden md:flex fixed bottom-0 right-50 pointer-events-none z-0">
      <img src="/static/splash.png" class="max-h-screen drop-shadow-[0_0_30px_rgba(22,163,255,0.35)]" loading="lazy" decoding="async"/>
    </div>
  </section>
  <script>
    function authForms() {
      return {
        tab: 'register',
        username: '',
        usernameError: '',
        password: '',
        passwordError: '',
        showPassword: false,
        passwordValid: false, 
        confirmPassword: '',
        confirmPasswordError: '',
        captchaResponse: '',
        globalError: '',

        validateUsername() {
          const usernameRegex = /^[a-zA-Z0-9_]+$/;
          if (!usernameRegex.test(this.username)) {
            this.usernameError = "Логин может содержать только латиницу и цифры";
            return false;
          }
          if (this.username.length < 3) {
            this.usernameError = "Логин должен быть не короче 3 символов";
            return false;
          }
          this.usernameError = '';
          return true;
        },

        checkPassword() {
          const passwordRegex = /^[a-zA-Z0-9!@#$%^&*()_+]+$/;
          if (this.password.length === 0) {
            this.passwordError = '';
            this.passwordValid = false;
            this.confirmPassword = '';
            return false;
          }
         
          if (!passwordRegex.test(this.password)) {
            this.passwordError = 'Пароль может содержать только латиницу, цифры и спецсимволы';
            this.passwordValid = false;
            this.confirmPassword = '';
            return false;
          }
          if (this.password.length < 6) {
            this.passwordError = 'Пароль должен быть не менее 6 символов';
            this.passwordValid = false;
            this.confirmPassword = ''; 
            return false;
          }
          this.passwordError = '';
          this.passwordValid = true;   
          return true;
        },

        checkConfirmPassword() {
          if (!this.confirmPassword) {
            this.confirmPasswordError = '';
            return true;
          }

          if (this.confirmPassword !== this.password) {
            this.confirmPasswordError = 'Пароли не совпадают';
            return false;
          }

          this.confirmPasswordError = '';
          return true;
        },

        handleRegister() {
          this.captchaResponse = window.captchaToken || '';

          const validUser = this.validateUsername();
          const validPass = this.checkPassword();
          const validConfirm = this.checkConfirmPassword();

          if (!validUser || !validPass || !validConfirm) return;

          if (!this.captchaResponse) {
            this.globalError = 'Подтвердите, что вы не робот';
            return;
          }

          this.globalError = '';
          alert('Регистрация отправлена (AJAX → сервер)');
        },

        handleLogin() {
          const validUser = this.validateUsername();
          const validPass = this.checkPassword();

          if (!validUser || !validPass) return;

          this.globalError = '';
          alert('Вход отправлен (AJAX → сервер)');
        },

        resetForm() {
          this.username = '';
          this.password = '';
          this.confirmPassword = '';
          this.globalError = '';
          this.usernameError = '';
          this.passwordError = '';
          this.confirmPasswordError = '';
          this.passwordValid = false;
        }
      }
    }

    window.captchaToken = '';
    function onCaptchaVerify(token) {
      window.captchaToken = token;
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 30 },
        color: { value: "#16a3ff" },
        shape: { type: "circle" },
        opacity: { value: 0.4 },
        size: { value: 2, random: true },
        line_linked: { enable: false },
        move: { enable: true, speed: 0.6, direction: "none", random: true, straight: false, out_mode: "out" }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: false },
          onclick: { enable: false }
        }
      },
      retina_detect: true
    });
  </script>
</body>
</html>
