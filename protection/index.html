<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rvn.guru</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      background: #1a1a1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
    }
    .center-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
      padding: 0 16px;
    }
    .site-title {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.7em;
      color: #fff;
      letter-spacing: 0.01em;
    }
    .site-desc {
      font-size: 1.08rem;
      color: #b0b0b0;
      margin-bottom: 2.5em;
      font-weight: 400;
    }
    .cf-turnstile {
      display: flex;
      justify-content: center;
      margin: 0 auto 2.5em auto;
    }
    .footer {
      color: #888;
      font-size: 1rem;
      margin-top: 3em;
      opacity: 0.7;
      user-select: none;
    }
    @media (max-width: 480px) {
      .center-container { padding: 0 4px; }
      .site-title { font-size: 1.3rem; }
      .site-desc { font-size: 0.97rem; }
    }
  </style>
</head>
<body>
  <div class="center-container">
    <div class="site-title">rvn.guru</div>
    <div class="site-desc" id="site-desc">
      Проверяем, человек ли вы. Это может занять несколько секунд.
    </div>
    <div class="cf-turnstile"
      data-sitekey="0x4AAAAAAB0s4O-sxm9ZnAQk"
      data-callback="onSuccessCallback"
      data-error-callback="onErrorCallback"
      data-before-interactive-callback="onBeforeInteractiveCallback"
      data-after-interactive-callback="onAfterInteractiveCallback"
      data-unsupported-callback="onUnsupportedCallback"
      data-theme="dark"
      data-size="normal"></div>
    <div id="error" class="footer" style="display:none; color:#ff6b6b;">
      Ошибка проверки. Обновите страницу или попробуйте позже.
    </div>
    <div class="footer" id="footer">
      Сначала rvn.guru необходимо проверить безопасность вашего подключения.
    </div>
  </div>

  <script>
    const captchaStates = {
      LOADING: 'loading',
      INTERACTIVE: 'interactive',
      VERIFYING: 'verifying',
      SUCCESS: 'success',
      ERROR: 'error'
    };
    
    let currentState = captchaStates.LOADING;

    function updateStatusText() {
      const desc = document.getElementById('site-desc');
      const footer = document.getElementById('footer');
      
      if (!desc) return;
      
      switch(currentState) {
        case captchaStates.LOADING:
          desc.textContent = 'Загрузка проверки безопасности...';
          if (footer) footer.textContent = 'Пожалуйста, подождите.';
          break;
        case captchaStates.INTERACTIVE:
          desc.textContent = 'Подтвердите, что вы человек, выполнив указанное действие ниже.';
          if (footer) footer.textContent = 'Выполните проверку безопасности.';
          break;
        case captchaStates.VERIFYING:
          desc.textContent = 'Проверка выполняется...';
          if (footer) footer.textContent = 'Пожалуйста, подождите.';
          break;
        case captchaStates.SUCCESS:
          desc.textContent = 'Проверка пройдена успешно!';
          if (footer) footer.textContent = 'Перенаправляем на сайт...';
          break;
        case captchaStates.ERROR:
          desc.textContent = 'Ошибка проверки безопасности';
          if (footer) {
            footer.style.color = '#ff6b6b';
            footer.textContent = 'Обновите страницу или попробуйте позже.';
          }
          break;
      }
    }

    function onBeforeInteractiveCallback() {
      console.log('Капча переходит в интерактивный режим');
      currentState = captchaStates.INTERACTIVE;
      updateStatusText();
    }

    function onAfterInteractiveCallback() {
      console.log('Капча завершила интерактивный режим');
      currentState = captchaStates.VERIFYING;
      updateStatusText();
    }

    function onUnsupportedCallback() {
      console.log('Браузер не поддерживается');
      currentState = captchaStates.ERROR;
      updateStatusText();
    }

    function onSuccessCallback(token) {
      console.log('✅ Капча пройдена! Токен:', token);
      currentState = captchaStates.SUCCESS;
      updateStatusText();
      const urlParams = new URLSearchParams(window.location.search);
      let redirectUrl = urlParams.get('redirect') || '/';
      if (typeof redirectUrl !== 'string' ||
          !redirectUrl.startsWith('/') ||
          redirectUrl.startsWith('//') ||
          redirectUrl.includes('://')) {
        redirectUrl = '/';
      }
      
      setTimeout(() => {
        window.location.href = redirectUrl;
      }, 1000);
    }

    function onErrorCallback() {
      console.error('❌ Ошибка капчи');
      currentState = captchaStates.ERROR;
      updateStatusText();
      
      const errorDiv = document.getElementById('error');
      if (errorDiv) {
        errorDiv.style.display = 'block';
      }
    }

    function observeCaptchaContainer() {
      const container = document.querySelector('.cf-turnstile');
      if (!container) {
        setTimeout(observeCaptchaContainer, 100);
        return;
      }

      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          if (mutation.type === 'childList') {
            const iframe = container.querySelector('iframe');
            if (iframe && currentState === captchaStates.LOADING) {
              console.log('Iframe капчи загружен');
              currentState = captchaStates.INTERACTIVE;
              updateStatusText();
            }
          }
        });
      });

      observer.observe(container, {
        childList: true,
        subtree: true
      });

      setTimeout(() => {
        const iframe = container.querySelector('iframe');
        if (iframe && currentState === captchaStates.LOADING) {
          console.log('Iframe обнаружен (фолбэк)');
          currentState = captchaStates.INTERACTIVE;
          updateStatusText();
        }
      }, 2000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      observeCaptchaContainer();
      setTimeout(() => {
        if (!window.turnstile && currentState === captchaStates.LOADING) {
          console.error('Turnstile не загрузился');
          currentState = captchaStates.ERROR;
          updateStatusText();
        }
      }, 10000);
    });
  </script>
</body>
</html>
