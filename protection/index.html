<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rvn.guru</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      background: #1a1a1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
    }
    .center-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      text-align: center;
      padding: 0 16px;
    }
    .site-title {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.7em;
      color: #fff;
      letter-spacing: 0.01em;
    }
    .site-desc {
      font-size: 1.08rem;
      color: #b0b0b0;
      margin-bottom: 2.5em;
      font-weight: 400;
    }
    .cf-turnstile {
      display: flex;
      justify-content: center;
      margin: 0 auto 2.5em auto;
    }
    .footer {
      color: #888;
      font-size: 1rem;
      margin-top: 3em;
      opacity: 0.7;
      user-select: none;
    }
    @media (max-width: 480px) {
      .center-container { padding: 0 4px; }
      .site-title { font-size: 1.3rem; }
      .site-desc { font-size: 0.97rem; }
    }
  </style>
</head>
<body>
  <div class="center-container">
    <div class="site-title">rvn.guru</div>
    <div class="site-desc" id="site-desc">
      Проверяем, человек ли вы. Это может занять несколько секунд.
    </div>
    <div class="cf-turnstile"
      data-sitekey="0x4AAAAAAB0s4O-sxm9ZnAQk"
      data-callback="onSuccessCallback"
      data-error-callback="onErrorCallback"
      data-theme="dark"
      data-size="normal"></div>
    <div id="error" class="footer" style="display:none; color:#ff6b6b;">
      Ошибка проверки. Обновите страницу или попробуйте позже.
    </div>
    <div class="footer" id="footer">
      Сначала rvn.guru необходимо проверить безопасность вашего подключения.
    </div>
  </div>

  <script>
    function onSuccessCallback(token) {
      // const expiration = new Date();
      // expiration.setTime(expiration.getTime() + (2 * 60 * 60 * 1000));
      // document.cookie = `access_granted=true; expires=${expiration.toUTCString()}; path=/; domain=.rvn.guru; Secure; SameSite=Lax`;
      const urlParams = new URLSearchParams(window.location.search);
      let redirectUrl = urlParams.get('redirect') || '/';
      if (
        typeof redirectUrl !== 'string' ||
        !redirectUrl.startsWith('/') ||
        redirectUrl.startsWith('//') ||
        redirectUrl.includes('://')
      ) {
        redirectUrl = '/';
      }
      setTimeout(() => {
        window.location.href = redirectUrl;
      }, 1000);
    }

    function onErrorCallback() {
      const footer = document.getElementById('footer');
      if (footer) {
        footer.style.color = '#ff6b6b';
        footer.textContent = 'Ошибка проверки. Обновите страницу или попробуйте позже.';
      }
    }

    // Если не загрузился turnstile вообще
    setTimeout(() => {
      if (!window.turnstile) {
        const footer = document.getElementById('footer');
        if (footer) {
          footer.style.color = '#ff6b6b';
          footer.textContent = 'Не удалось загрузить проверку безопасности. Проверьте подключение к интернету.';
        }
      }
    }, 10000);

    // --- Новый рабочий код отслеживания появления iframe ---
    function setHumanText() {
      const desc = document.getElementById('site-desc');
      if (desc) {
        desc.textContent = 'Подтвердите, что вы человек, выполнив указанное действие.';
      }
    }

    function observeIframe(container) {
      const iframe = container.querySelector('iframe');
      if (iframe) {
        setHumanText();
        return;
      }
      const observer = new MutationObserver(() => {
        const iframeNow = container.querySelector('iframe');
        if (iframeNow) {
          setHumanText();
          observer.disconnect();
        }
      });
      observer.observe(container, { childList: true, subtree: true });
    }

    function waitForTurnstile() {
      const container = document.querySelector('.cf-turnstile');
      if (container) {
        observeIframe(container);
      } else {
        requestAnimationFrame(waitForTurnstile);
      }
    }

    waitForTurnstile();
  </script>
</body>
</html>
